{% extends "base.html" %}
{% block content %}
<div style="max-width:420px;margin:20px auto"><h1>Welcome back</h1>
<form method="post" class="card" style="padding:20px">{% csrf_token %}
{% if form.errors %}<p class="errorlist">Wrong username or password.</p>{% endif %}
<p><label>Username</label>{{ form.username }}</p><p><label>Password</label>{{ form.password }}</p>
<button style="width:100%;padding:13px">Log in</button></form>
<p class="mut" style="text-align:center">New here? <a href="{% url 'signup' %}">Create a free account</a></p></div>
{% endblock %}
